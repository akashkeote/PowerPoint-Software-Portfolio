<div class="hero-text">
  <h1 class="text-gradient" style="font-family: 'Segoe UI', 'Aptos', sans-serif;font-weight:800;">Akash Keote</h1>
  <p style="font-size:clamp(9px,1vw,13px); letter-spacing:2px; text-transform:uppercase; color:var(--text-main); opacity:0.85; margin-bottom:clamp(16px,2vw,28px); font-weight:500;">
    Full Stack Developer &amp; AI Engineer</p>
  <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
    <button onclick="goToSlide(1)" style="
                display:inline-flex; align-items:center; gap:8px;
                background: #ffffff; color:#000000; border:none; border-radius:50px; padding:10px 22px;
                font-size:clamp(11px,1.1vw,14px); font-weight:600; cursor:pointer;
                box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2); transition: transform 0.2s, box-shadow 0.2s;
                font-family: 'Segoe UI', 'Aptos', sans-serif;
              "
      onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 6px 20px rgba(255, 255, 255, 0.4)'"
      onmouseout="this.style.transform='none';this.style.boxShadow='0 4px 15px rgba(255, 255, 255, 0.2)'">
      Explore Work
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>
    </button>
    <button id="download-cv-btn"
      onclick="window.open('https://drive.google.com/drive/folders/1ID1uHzPu7DBdMX9e4SsYGLmeYbclXA76?usp=drive_link','_blank','noopener,noreferrer')"
      style="
                display:inline-flex; align-items:center; gap:8px; background: transparent; color:var(--text-main); border:1.5px solid var(--text-main);
                border-radius:50px; padding:10px 22px; font-size:clamp(11px,1.1vw,14px); font-weight:500; cursor:pointer;
                transition: all 0.2s; font-family: 'Segoe UI', 'Aptos', sans-serif;
              "
      onmouseover="this.style.background='var(--okta-accent)';this.style.borderColor='var(--okta-accent)';this.style.color='#fff'"
      onmouseout="this.style.background='transparent';this.style.borderColor='var(--text-main)';this.style.color='var(--text-main)'">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>
      Download CV
    </button>
  </div>
</div>
