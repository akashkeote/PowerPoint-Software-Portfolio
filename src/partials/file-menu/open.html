<!-- ==================== OPEN PANEL ==================== -->
<div class="file-main" id="file-panel-open" style="display:none">
  <h2 class="file-title">Open</h2>
  <div style="display:flex; gap:32px;">
    <!-- Left: Locations -->
    <div style="min-width:220px;">
      <div style="display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--bg-hover); border-radius:6px; margin-bottom:8px; cursor:pointer;">
        <i data-feather="clock" style="color:#c0392b; width:20px; height:20px;"></i>
        <span style="font-size:13px; font-weight:500; color:var(--text-main);">Recent</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:6px; margin-bottom:8px; cursor:pointer;" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='transparent'">
        <span style="color:#0078d4; font-size:20px;">&#9729;</span>
        <span style="font-size:13px; font-weight:500; color:var(--text-main);">OneDrive &ndash; Personal</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:6px; margin-bottom:8px; cursor:pointer;" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='transparent'">
        <i data-feather="monitor" style="color:var(--text-muted); width:20px; height:20px;"></i>
        <span style="font-size:13px; font-weight:500; color:var(--text-main);">This PC</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:6px; margin-bottom:8px; cursor:pointer;" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='transparent'">
        <i data-feather="plus-circle" style="color:var(--text-muted); width:20px; height:20px;"></i>
        <span style="font-size:13px; font-weight:500; color:var(--text-main);">Add a Place</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:6px; cursor:pointer;" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='transparent'">
        <i data-feather="folder" style="color:var(--text-muted); width:20px; height:20px;"></i>
        <span style="font-size:13px; font-weight:500; color:var(--text-main);">Browse</span>
      </div>
    </div>
    <!-- Right: Recent files -->
    <include src="./open.recent.html" />
  </div>
</div>
