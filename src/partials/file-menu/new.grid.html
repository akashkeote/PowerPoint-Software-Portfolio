<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:16px;">
  <div style="cursor:pointer; text-align:center;">
    <div style="width:100%; aspect-ratio:16/10; background:var(--bg-card); border:2px solid var(--border-color); border-radius:6px; display:flex; align-items:center; justify-content:center; transition:border-color 0.2s; margin-bottom:6px;" onmouseover="this.style.borderColor='#c0392b'" onmouseout="this.style.borderColor='var(--border-color)'">
      <svg width="40" height="40" fill="none"><rect x="8" y="8" width="24" height="24" rx="2" stroke="#777" stroke-width="1.5" stroke-dasharray="3 2"/><line x1="20" y1="14" x2="20" y2="26" stroke="#777" stroke-width="1.5"/><line x1="14" y1="20" x2="26" y2="20" stroke="#777" stroke-width="1.5"/></svg>
    </div>
    <span style="font-size:12px; color:var(--text-main);">Blank Presentation</span>
  </div>
  <div style="cursor:pointer; text-align:center;">
    <div style="width:100%; aspect-ratio:16/10; background:linear-gradient(135deg, #1a1a2e, #16213e); border:2px solid var(--border-color); border-radius:6px; display:flex; align-items:center; justify-content:center; transition:border-color 0.2s; margin-bottom:6px;" onmouseover="this.style.borderColor='#c0392b'" onmouseout="this.style.borderColor='var(--border-color)'">
      <span style="color:#fff; font-size:10px; font-weight:600; letter-spacing:0.5px;">PORTFOLIO</span>
    </div>
    <span style="font-size:12px; color:var(--text-main);">Dark Portfolio</span>
  </div>
  <div style="cursor:pointer; text-align:center;">
    <div style="width:100%; aspect-ratio:16/10; background:linear-gradient(135deg, #f5f5f5, #e0e0e0); border:2px solid var(--border-color); border-radius:6px; display:flex; align-items:center; justify-content:center; transition:border-color 0.2s; margin-bottom:6px;" onmouseover="this.style.borderColor='#c0392b'" onmouseout="this.style.borderColor='var(--border-color)'">
      <span style="color:#333; font-size:10px; font-weight:600; letter-spacing:0.5px;">MINIMALIST</span>
    </div>
    <span style="font-size:12px; color:var(--text-main);">Minimalist</span>
  </div>
  <div style="cursor:pointer; text-align:center;">
    <div style="width:100%; aspect-ratio:16/10; background:linear-gradient(135deg, #0f3460, #533483); border:2px solid var(--border-color); border-radius:6px; display:flex; align-items:center; justify-content:center; transition:border-color 0.2s; margin-bottom:6px;" onmouseover="this.style.borderColor='#c0392b'" onmouseout="this.style.borderColor='var(--border-color)'">
      <span style="color:#e94560; font-size:10px; font-weight:600; letter-spacing:0.5px;">TECH PITCH</span>
    </div>
    <span style="font-size:12px; color:var(--text-main);">Tech Pitch</span>
  </div>
  <div style="cursor:pointer; text-align:center;">
    <div style="width:100%; aspect-ratio:16/10; background:linear-gradient(135deg, #2c3e50, #34495e); border:2px solid var(--border-color); border-radius:6px; display:flex; align-items:center; justify-content:center; transition:border-color 0.2s; margin-bottom:6px;" onmouseover="this.style.borderColor='#c0392b'" onmouseout="this.style.borderColor='var(--border-color)'">
      <span style="color:#ecf0f1; font-size:10px; font-weight:600; letter-spacing:0.5px;">CORPORATE</span>
    </div>
    <span style="font-size:12px; color:var(--text-main);">Corporate</span>
  </div>
</div>
