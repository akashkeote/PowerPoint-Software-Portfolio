<!-- ==================== OPTIONS PANEL ==================== -->
<div class="file-main" id="file-panel-options" style="display:none">
  <h2 class="file-title">Options</h2>
  <div style="max-width:600px;">
    <include src="./options.general.html" />
    <include src="./options.personalize.html" />
    <include src="./options.slideshow.html" />
    
    <!-- Buttons -->
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button style="background:#c0392b; color:white; border:none; padding:8px 24px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer;">OK</button>
      <button style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); padding:8px 24px; border-radius:4px; font-size:13px; cursor:pointer;" onclick="document.getElementById('file-menu-overlay').style.display='none'">Cancel</button>
    </div>
  </div>
</div>
