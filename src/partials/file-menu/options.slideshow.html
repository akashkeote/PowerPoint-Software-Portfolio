<!-- Slide Show Section -->
<div style="margin-bottom:24px;">
  <h3 style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:14px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">Slide Show</h3>
  <div style="display:flex; flex-direction:column; gap:10px;">
    <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
      <input type="checkbox" checked style="margin-right:10px; accent-color:#c0392b;"> Show menu on right mouse click
    </label>
    <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
      <input type="checkbox" checked style="margin-right:10px; accent-color:#c0392b;"> Show popup toolbar
    </label>
    <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
      <input type="checkbox" checked style="margin-right:10px; accent-color:#c0392b;"> End with black slide
    </label>
  </div>
</div>
