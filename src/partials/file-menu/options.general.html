<!-- General Section -->
<div style="margin-bottom:24px;">
  <h3 style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:14px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">General</h3>
  <div style="display:flex; flex-direction:column; gap:10px;">
    <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
      <input type="checkbox" checked style="margin-right:10px; accent-color:#c0392b;"> Show Mini Toolbar on selection
    </label>
    <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
      <input type="checkbox" checked style="margin-right:10px; accent-color:#c0392b;"> Enable Live Preview
    </label>
    <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
      <input type="checkbox" style="margin-right:10px; accent-color:#c0392b;"> Show Start Screen when this application starts
    </label>
  </div>
</div>
