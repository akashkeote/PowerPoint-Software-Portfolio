<div style="min-width:280px; max-width:320px;">
  <div style="margin-bottom:16px;">
    <span style="font-size:12px; color:var(--text-muted); font-weight:500; display:block; margin-bottom:6px;">Copies</span>
    <input type="number" value="1" min="1" style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; padding:6px 10px; font-size:13px; width:80px;">
  </div>
  <button style="background:#c0392b; color:white; border:none; padding:10px 28px; border-radius:4px; font-size:14px; font-weight:600; cursor:pointer; margin-bottom:20px; display:flex; align-items:center; gap:8px;">
    <i data-feather="printer" style="width:16px; height:16px;"></i> Print
  </button>
  <div style="margin-bottom:14px;">
    <span style="font-size:12px; color:var(--text-muted); font-weight:500; display:block; margin-bottom:6px;">Printer</span>
    <select style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; padding:6px 10px; font-size:12px; width:100%;">
      <option>Microsoft Print to PDF</option>
      <option>Microsoft XPS Document Writer</option>
      <option>OneNote (Desktop)</option>
    </select>
  </div>
  <div style="margin-bottom:14px;">
    <span style="font-size:12px; color:var(--text-muted); font-weight:500; display:block; margin-bottom:6px;">Settings</span>
    <select style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; padding:6px 10px; font-size:12px; width:100%; margin-bottom:6px;">
      <option>Print All Slides</option>
      <option>Print Selection</option>
      <option>Print Current Slide</option>
      <option>Custom Range</option>
    </select>
    <select style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; padding:6px 10px; font-size:12px; width:100%; margin-bottom:6px;">
      <option>Full Page Slides</option>
      <option>Notes Pages</option>
      <option>Outline</option>
      <option>Handouts (2 Slides Per Page)</option>
    </select>
    <select style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; padding:6px 10px; font-size:12px; width:100%;">
      <option>Color</option>
      <option>Grayscale</option>
      <option>Pure Black and White</option>
    </select>
  </div>
</div>
