<!-- ==================== SHARE PANEL ==================== -->
      <div class="file-main" id="file-panel-share" style="display:none">
        <h2 class="file-title">Share</h2>
        <div style="max-width:500px;">
          <!-- Share with People -->
          <div style="margin-bottom:28px;">
            <h3 style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:12px;">Share with People</h3>
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
              <input type="text" placeholder="Enter a name or email address" style="flex:1; background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; padding:8px 12px; font-size:13px;">
              <button style="background:#c0392b; color:white; border:none; padding:8px 20px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer;">Share</button>
            </div>
            <div style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-muted);">
              <i data-feather="link" style="width:14px; height:14px;"></i>
              <span>Anyone with the link can view</span>
            </div>
          </div>
          <!-- Or share via -->
          <div style="margin-bottom:28px;">
            <h3 style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:12px;">Or Share Via</h3>
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
              <div style="display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--bg-hover); border-radius:6px; cursor:pointer; transition:background 0.2s;" onmouseover="this.style.background='rgba(99,102,241,0.15)'" onmouseout="this.style.background='var(--bg-hover)'">
                <i data-feather="mail" style="color:#4a90d9; width:18px; height:18px;"></i>
                <span style="font-size:12px; color:var(--text-main);">Email</span>
              </div>
              <div style="display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--bg-hover); border-radius:6px; cursor:pointer; transition:background 0.2s;" onmouseover="this.style.background='rgba(99,102,241,0.15)'" onmouseout="this.style.background='var(--bg-hover)'">
                <i data-feather="copy" style="color:#27ae60; width:18px; height:18px;"></i>
                <span style="font-size:12px; color:var(--text-main);">Copy Link</span>
              </div>
              <div style="display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--bg-hover); border-radius:6px; cursor:pointer; transition:background 0.2s;" onmouseover="this.style.background='rgba(99,102,241,0.15)'" onmouseout="this.style.background='var(--bg-hover)'">
                <i data-feather="download" style="color:#e8a000; width:18px; height:18px;"></i>
                <span style="font-size:12px; color:var(--text-main);">Download a Copy</span>
              </div>
            </div>
          </div>
          <!-- Export formats -->
          <div>
            <h3 style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:12px;">Export As</h3>
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
              <div style="display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--bg-hover); border-radius:6px; cursor:pointer;" onmouseover="this.style.background='rgba(99,102,241,0.15)'" onmouseout="this.style.background='var(--bg-hover)'">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="2" stroke="#c0392b" stroke-width="1.5"/><text x="9" y="12" text-anchor="middle" font-size="6" fill="#c0392b" font-weight="bold">PDF</text></svg>
                <span style="font-size:12px; color:var(--text-main);">PDF</span>
              </div>
              <div style="display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--bg-hover); border-radius:6px; cursor:pointer;" onmouseover="this.style.background='rgba(99,102,241,0.15)'" onmouseout="this.style.background='var(--bg-hover)'">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="2" stroke="#4a90d9" stroke-width="1.5"/><text x="9" y="12" text-anchor="middle" font-size="5" fill="#4a90d9" font-weight="bold">PPTX</text></svg>
                <span style="font-size:12px; color:var(--text-main);">PPTX</span>
              </div>
              <div style="display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--bg-hover); border-radius:6px; cursor:pointer;" onmouseover="this.style.background='rgba(99,102,241,0.15)'" onmouseout="this.style.background='var(--bg-hover)'">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="2" stroke="#27ae60" stroke-width="1.5"/><text x="9" y="12" text-anchor="middle" font-size="5" fill="#27ae60" font-weight="bold">MP4</text></svg>
                <span style="font-size:12px; color:var(--text-main);">Video</span>
              </div>
            </div>
          </div>
        </div>
      </div>
