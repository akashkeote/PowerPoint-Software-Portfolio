<!-- ==================== INFO PANEL ==================== -->
<div class="file-main" id="file-panel-info" style="display:none">
  <h2 class="file-title">Info</h2>
  <h3 style="font-size:18px; font-weight:500; color:var(--text-main); margin-bottom:20px;">Akash_Developer_Portfolio</h3>
  <div style="display:flex; gap:40px;">
    <!-- Left: Actions -->
    <div style="flex:1; max-width:360px;">
      <div style="display:flex; align-items:flex-start; gap:14px; padding:16px; background:var(--bg-hover); border-radius:8px; margin-bottom:12px; cursor:pointer;">
        <i data-feather="lock" style="color:#e8a000; width:28px; height:28px; flex-shrink:0;"></i>
        <div>
          <div style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:2px;">Protect Presentation</div>
          <div style="font-size:11px; color:var(--text-muted);">Control what types of changes people can make to this presentation.</div>
        </div>
      </div>
      <div style="display:flex; align-items:flex-start; gap:14px; padding:16px; background:var(--bg-hover); border-radius:8px; margin-bottom:12px; cursor:pointer;">
        <i data-feather="shield" style="color:#27ae60; width:28px; height:28px; flex-shrink:0;"></i>
        <div>
          <div style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:2px;">Inspect Presentation</div>
          <div style="font-size:11px; color:var(--text-muted);">Before publishing, check for hidden properties or personal information.</div>
        </div>
      </div>
      <div style="display:flex; align-items:flex-start; gap:14px; padding:16px; background:var(--bg-hover); border-radius:8px; margin-bottom:12px; cursor:pointer;">
        <i data-feather="layers" style="color:#4a90d9; width:28px; height:28px; flex-shrink:0;"></i>
        <div>
          <div style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:2px;">Manage Presentation</div>
          <div style="font-size:11px; color:var(--text-muted);">Check in, check out, and recover unsaved changes.</div>
        </div>
      </div>
    </div>
    <!-- Right: Properties -->
    <include src="./info.properties.html" />
  </div>
</div>
