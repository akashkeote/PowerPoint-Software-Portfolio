<!-- Tutorial Guide Overlay -->
<div id="tutorial-guide" class="tutorial-guide">
  <!-- Backdrop -->
  <div class="tutorial-backdrop" id="tutorial-backdrop"></div>

  <!-- Character + Speech Bubble Container -->
  <div class="tutorial-container" id="tutorial-container">
    <!-- Speech Bubble -->
    <div class="tutorial-bubble" id="tutorial-bubble">
      <div class="tutorial-bubble-header">
        <span class="tutorial-bubble-label">Guide</span>
      </div>
      <div class="tutorial-bubble-text" id="tutorial-bubble-text"></div>
      <div class="tutorial-bubble-actions">
        <span class="tutorial-step-counter" id="tutorial-step-counter"></span>
        <div class="tutorial-btns">
          <button class="tutorial-skip" id="tutorial-skip">Skip</button>
          <button class="tutorial-next" id="tutorial-next">Next →</button>
        </div>
      </div>
      <!-- Play indicator -->
      <div class="tutorial-play-indicator">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="14" fill="#6366f1"/>
          <polygon points="11,8 22,14 11,20" fill="white"/>
        </svg>
      </div>
    </div>

    <!-- 3D Character - Professional bearded man in maroon suit -->
    <div class="tutorial-character" id="tutorial-character">
      <img src="/images/guide-welcome.png" alt="Tutorial Guide" draggable="false" />
    </div>
  </div>

  <!-- Highlight ring for pointed elements -->
  <div class="tutorial-highlight" id="tutorial-highlight"></div>
</div>
