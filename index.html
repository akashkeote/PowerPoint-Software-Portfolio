<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akash K &ndash; PowerPoint Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/feather-icons"></script>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-attractors@0.1.6/build/matter-attractors.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-wrap@0.2.0/build/matter-wrap.min.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7077330275935634" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ============================
       BOOT SCREEN
  ============================= -->
  <div id="boot-screen">
    <div class="boot-card" style="background: white; border-radius: 5px; width: 440px; height: 290px; padding: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.2);">
      
      <!-- Top Left Label -->
      <div style="position: absolute; top: 14px; left: 14px; background: #c0392b; color: white; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.4px; font-family: 'Segoe UI', sans-serif;">
        Office 2024
      </div>

      <!-- Window controls -->
      <div style="position: absolute; top: 12px; right: 14px; display: flex; gap: 18px; color: #aaa; font-size: 13px; font-family: 'Segoe UI', sans-serif;">
        <span style="line-height: 1; margin-top: 2px;">─</span>
        <span>✕</span>
      </div>

      <!-- Center Logo & Microsoft -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding-top: 24px;">
        <!-- PPT Colorful Sphere Logo -->
        <svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sphereMain" cx="38%" cy="28%" r="72%">
              <stop offset="0%"  stop-color="#ffb347"/>
              <stop offset="30%" stop-color="#f26522"/>
              <stop offset="65%" stop-color="#d92b2b"/>
              <stop offset="100%" stop-color="#9a1a1a"/>
            </radialGradient>
            <radialGradient id="sheen" cx="38%" cy="22%" r="50%">
              <stop offset="0%"  stop-color="#ffe0a0" stop-opacity="0.7"/>
              <stop offset="100%" stop-color="#ff8c3a" stop-opacity="0"/>
            </radialGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <ellipse cx="48" cy="90" rx="30" ry="5" fill="rgba(0,0,0,0.15)"/>
          <circle cx="48" cy="46" r="42" fill="url(#sphereMain)"/>
          <circle cx="48" cy="46" r="42" fill="url(#sheen)"/>
          <text x="24" y="68" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="52" fill="white" opacity="0.96" filter="url(#glow)">P</text>
          <circle cx="74" cy="72" r="18" fill="#c0392b" stroke="white" stroke-width="2"/>
          <text x="64" y="80" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="18" fill="white">P</text>
        </svg>

        <!-- Microsoft 4-Color Logo -->
        <div style="display: flex; align-items: center; gap: 7px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2.5px; width: 18px; height: 18px;">
            <div style="background: #f25022; border-radius: 1px;"></div>
            <div style="background: #7fba00; border-radius: 1px;"></div>
            <div style="background: #00a4ef; border-radius: 1px;"></div>
            <div style="background: #ffb900; border-radius: 1px;"></div>
          </div>
          <span style="font-size: 13px; font-weight: 600; color: #444; font-family: 'Segoe UI', sans-serif; letter-spacing: 0.2px;">Microsoft</span>
        </div>
      </div>

      <!-- Loading Text -->
      <div style="padding: 10px 16px 12px; border-top: 1px solid #ebebeb; display: flex; align-items: center; justify-content: space-between;">
        <span id="boot-status" style="font-size: 11px; color: #777; font-family: 'Segoe UI', sans-serif;">Starting Microsoft PowerPoint...</span>
      </div>
    </div>
  </div>

  <!-- ============================
       MAIN APP
  ============================= -->
  <div id="app">

<include src="./partials/title-bar.html" />
<include src="./partials/file-menu.html" />
<include src="./partials/ribbon-tabs.html" />
    <!-- RIBBON TOOLBAR -->
    <include src="./partials/ribbon-toolbar.html" />
    <div class="main-content">

      <!-- SIDEBAR -->
      <include src="./partials/sidebar.html" />
    <div class="canvas-area">
        <div class="slide-wrapper">

                  <include src="./partials/slides/hero-slide.html" />
        <include src="./partials/slides/about-slide.html" />
        <include src="./partials/slides/skills-slide.html" />
        <include src="./partials/slides/projects-slide.html" />
          <include src="./partials/slides/contact-slide.html" />
        </div>
      </div>
    </div>

    <include src="./partials/status-bar.html" />
  </div>

        <include src="./partials/presentation-mode.html" />
    <!-- AI CHATBOT UI -->
            <include src="./partials/chat-bot.html" />
  <script type="module" src="/js/main.js"></script>
</body>
</html>
