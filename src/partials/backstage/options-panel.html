<!-- ==================== OPTIONS PANEL ==================== -->
      <div class="file-main" id="file-panel-options" style="display:none">
        <h2 class="file-title">Options</h2>
        <div style="max-width:600px;">
          <!-- General Section -->
          <div style="margin-bottom:24px;">
            <h3 style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:14px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">General</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
              <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
                <input type="checkbox" checked style="margin-right:10px; accent-color:#c0392b;"> Show Mini Toolbar on selection
              </label>
              <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
                <input type="checkbox" checked style="margin-right:10px; accent-color:#c0392b;"> Enable Live Preview
              </label>
              <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
                <input type="checkbox" style="margin-right:10px; accent-color:#c0392b;"> Show Start Screen when this application starts
              </label>
            </div>
          </div>
          <!-- Personalize Section -->
          <div style="margin-bottom:24px;">
            <h3 style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:14px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">Personalize your copy of Microsoft Office</h3>
            <div style="display:grid; grid-template-columns:auto 1fr; gap:10px 16px; align-items:center;">
              <span style="font-size:13px; color:var(--text-muted);">User name:</span>
              <input type="text" value="Akash Keote" style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; padding:6px 10px; font-size:13px;">
              <span style="font-size:13px; color:var(--text-muted);">Office Theme:</span>
              <select style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; padding:6px 10px; font-size:12px;">
                <option>Black</option>
                <option>Dark Gray</option>
                <option>Colorful</option>
                <option>White</option>
              </select>
              <span style="font-size:13px; color:var(--text-muted);">Office Background:</span>
              <select style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; padding:6px 10px; font-size:12px;">
                <option>No Background</option>
                <option>Calligraphy</option>
                <option>Circles and Stripes</option>
                <option>Circuit</option>
              </select>
            </div>
          </div>
          <!-- Slide Show Section -->
          <div style="margin-bottom:24px;">
            <h3 style="font-size:14px; font-weight:600; color:var(--text-main); margin-bottom:14px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">Slide Show</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
              <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
                <input type="checkbox" checked style="margin-right:10px; accent-color:#c0392b;"> Show menu on right mouse click
              </label>
              <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
                <input type="checkbox" checked style="margin-right:10px; accent-color:#c0392b;"> Show popup toolbar
              </label>
              <label style="display:flex; align-items:center; font-size:13px; color:var(--text-main); cursor:pointer;">
                <input type="checkbox" checked style="margin-right:10px; accent-color:#c0392b;"> End with black slide
              </label>
            </div>
          </div>
          <!-- Buttons -->
          <div style="display:flex; gap:10px; margin-top:20px;">
            <button style="background:#c0392b; color:white; border:none; padding:8px 24px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer;">OK</button>
            <button style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); padding:8px 24px; border-radius:4px; font-size:13px; cursor:pointer;" onclick="document.getElementById('file-menu-overlay').style.display='none'">Cancel</button>
          </div>
        </div>
