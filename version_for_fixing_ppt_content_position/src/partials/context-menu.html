<!-- Custom Right-Click Context Menu (PowerPoint-style) -->
<div id="ppt-context-menu" class="ppt-context-menu">
  <div class="ctx-item" data-action="cut">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 2h8v2H4zM3 5h10l-1 9H4L3 5z" fill="currentColor"/><path d="M6 7v5M10 7v5" stroke="var(--ctx-bg)" stroke-width="1"/></svg>
    <span>Cut</span>
    <span class="ctx-shortcut">Ctrl+X</span>
  </div>
  <div class="ctx-item" data-action="copy">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="5" width="9" height="10" rx="1.5" fill="currentColor" opacity="0.5"/><rect x="5" y="2" width="9" height="10" rx="1.5" fill="currentColor" opacity="0.8"/></svg>
    <span>Copy</span>
    <span class="ctx-shortcut">Ctrl+C</span>
  </div>
  <div class="ctx-item" data-action="paste">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="5" width="10" height="10" rx="1.5" fill="currentColor" opacity="0.5"/><rect x="5" y="2" width="6" height="3" rx="1" fill="currentColor"/><rect x="5" y="8" width="6" height="1.5" rx="0.75" fill="var(--ctx-bg)" opacity="0.6"/><rect x="5" y="11" width="4" height="1.5" rx="0.75" fill="var(--ctx-bg)" opacity="0.6"/></svg>
    <span>Paste</span>
    <span class="ctx-shortcut">Ctrl+V</span>
  </div>

  <div class="ctx-divider"></div>

  <div class="ctx-item" data-action="copy-slide-link">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 8h4M5 6H4a3 3 0 000 4h1M11 6h1a3 3 0 010 4h-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>Copy Slide Link</span>
  </div>
  <div class="ctx-item" data-action="share">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="12" cy="4" r="2" fill="currentColor"/><circle cx="4" cy="8" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><line x1="6" y1="7" x2="10" y2="5" stroke="currentColor" stroke-width="1.2"/><line x1="6" y1="9" x2="10" y2="11" stroke="currentColor" stroke-width="1.2"/></svg>
    <span>Share Portfolio</span>
  </div>

  <div class="ctx-divider"></div>

  <div class="ctx-item" data-action="presentation">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="9" rx="1" stroke="currentColor" stroke-width="1.3" fill="none"/><polygon points="6,5.5 11,7.5 6,9.5" fill="currentColor"/><line x1="6" y1="14" x2="10" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><line x1="8" y1="12" x2="8" y2="14" stroke="currentColor" stroke-width="1.3"/></svg>
    <span>Start Presentation</span>
    <span class="ctx-shortcut">F5</span>
  </div>
  <div class="ctx-item" data-action="fullscreen">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Full Screen</span>
    <span class="ctx-shortcut">F11</span>
  </div>

  <div class="ctx-divider"></div>

  <div class="ctx-item" data-action="toggle-theme">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M14 8.6A6 6 0 117.4 2 4.7 4.7 0 0014 8.6z" fill="currentColor"/></svg>
    <span id="ctx-theme-label">Switch to Light Mode</span>
  </div>



  <div class="ctx-divider"></div>

  <div class="ctx-item" data-action="view-source">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5 4L1 8l4 4M11 4l4 4-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><line x1="9" y1="2" x2="7" y2="14" stroke="currentColor" stroke-width="1" opacity="0.5"/></svg>
    <span>View Source Code</span>
  </div>
</div>
