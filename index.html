<body>

  <!-- ============================
       BOOT SCREEN
  ============================= -->
  <div id="boot-screen">
    <div class="boot-card" style="background: white; border-radius: 5px; width: 440px; height: 290px; padding: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.2);">
      
      <!-- Top Left Label -->
      <div style="position: absolute; top: 14px; left: 14px; background: #c0392b; color: white; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 3px; letter-spacing: 0.4px; font-family: 'Segoe UI', sans-serif;">
        Office 2024
      </div>

      <!-- Window controls -->
      <div style="position: absolute; top: 12px; right: 14px; display: flex; gap: 18px; color: #aaa; font-size: 13px; font-family: 'Segoe UI', sans-serif;">
        <span style="line-height: 1; margin-top: 2px;">─</span>
        <span>✕</span>
      </div>

      <!-- Center Logo & Microsoft -->
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding-top: 24px;">
        <!-- PowerPoint 365 Logo -->
        <svg width="80" height="80" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="slideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ED6C47"/>
              <stop offset="100%" stop-color="#C43E1C"/>
            </linearGradient>
            <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FF8F6B"/>
              <stop offset="100%" stop-color="#D95B37"/>
            </linearGradient>
          </defs>
          <!-- Slide shape (back panel) -->
          <rect x="30" y="12" width="56" height="72" rx="4" fill="url(#panelGrad)" opacity="0.35"/>
          <!-- Slide shape (front panel) -->
          <rect x="36" y="18" width="50" height="60" rx="3" fill="#FFF" opacity="0.9"/>
          <rect x="42" y="28" width="38" height="6" rx="2" fill="#E8E8E8"/>
          <rect x="42" y="40" width="28" height="4" rx="2" fill="#F0F0F0"/>
          <rect x="42" y="50" width="32" height="4" rx="2" fill="#F0F0F0"/>
          <rect x="42" y="60" width="20" height="4" rx="2" fill="#F0F0F0"/>
          <!-- P badge -->
          <rect x="10" y="24" width="40" height="48" rx="6" fill="url(#slideGrad)"/>
          <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="32" fill="white">P</text>
        </svg>

        <!-- Microsoft 4-Color Logo -->
        <div style="display: flex; align-items: center; gap: 7px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2.5px; width: 18px; height: 18px;">
            <div style="background: #f25022; border-radius: 1px;"></div>
            <div style="background: #7fba00; border-radius: 1px;"></div>
            <div style="background: #00a4ef; border-radius: 1px;"></div>
            <div style="background: #ffb900; border-radius: 1px;"></div>
          </div>
          <span style="font-size: 13px; font-weight: 600; color: #444; font-family: 'Segoe UI', sans-serif; letter-spacing: 0.2px;">Microsoft</span>
        </div>
      </div>

      <!-- Loading Text -->
      <div style="padding: 10px 16px 12px; border-top: 1px solid #ebebeb; display: flex; align-items: center; justify-content: space-between;">
        <span id="boot-status" style="font-size: 11px; color: #777; font-family: 'Segoe UI', sans-serif;">Starting Microsoft PowerPoint...</span>
      </div>
    </div>
  </div>
